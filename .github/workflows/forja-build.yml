# forja-workflow-v3 — managed by Forja. Builds projects pushed to build/* branches.
name: Forja Build
run-name: forja ${{ inputs.build_ref }}
on:
  workflow_dispatch:
    inputs:
      build_ref:
        description: Branch with the project to compile
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.build_ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            17
            21
            25
      - name: Compile
        run: bash .forja/build-all.sh
      - uses: actions/upload-artifact@v4
        with:
          name: forja-jars
          path: forja-out/
          if-no-files-found: error
          retention-days: 3
